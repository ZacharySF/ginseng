[project]
name = "ginseng"
version = "0.1.0"
description = "Probabilistic liquidity planning for variable-income investors"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "arch>=7.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/ginseng"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]
