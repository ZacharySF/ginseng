[project]
name = "ginseng"
version = "0.1.0"
description = "Probabilistic liquidity planning for variable-income investors"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "arch>=7.2",
]

[project.scripts]
ginseng = "ginseng.cli:main"

[project.optional-dependencies]
native-build = ["pybind11==2.13.6", "scikit-build-core==0.10.7", "build==1.2.2.post1"]
app = ["anyio>=4.0", "fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.28", "pydantic>=2.10"]
optimization = ["cvxpy>=1.4"]
research = ["matplotlib>=3.9", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]
tui = ["textual>=0.60"]
dev = ["pytest>=8.3", "ginseng[app,optimization,research,tui]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/ginseng"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]

[dependency-groups]
dev = [
    "colorspacious>=1.1.2",
    "pytest-textual-snapshot>=1.0.0",
]
