<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved preference before rendering to avoid a white flash.
			(() => {
				let theme = 'light';
				try { if (localStorage.getItem('ginseng.theme') === 'dark') theme = 'dark'; } catch {}
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<title>Ginseng</title>
		<link rel="icon" type="image/svg+xml" href="/brand/ginseng-avatar.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
